name: 🚀 Deploy ProductAI MCP Server to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: 🧠 Test SSH connectivity
        run: |
          ssh -o StrictHostKeyChecking=no -o IdentitiesOnly=yes -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "echo '✅ SSH connection successful!'"

      - name: 🚀 Deploy application using Docker
        run: |
          ssh -o IdentitiesOnly=yes -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            echo "🔄 Deploying ProductAI MCP Server with Docker..."

            cd /home/ubuntu

            # Clone repo if not exists
            if [ ! -d "productai-mcp-server" ]; then
              echo "📂 Cloning repository..."
              git clone https://github.com/goutama-opura/productai-mcp-server.git
            fi

            cd productai-mcp-server

            echo "🔄 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "🧩 Writing environment variables..."
            echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > .env
            echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env

            echo "🐳 Building Docker image..."
            docker build -t productai-mcp-server:latest .

            echo "🛑 Stopping any existing container..."
            docker rm -f productai-mcp-server || true

            echo "🚀 Starting container..."
            docker run -d \
              --name productai-mcp-server \
              -p 8001:8001 \
              --env-file .env \
              --restart always \
              productai-mcp-server:latest

            echo "✅ Deployment Successful. API running at http://${{ secrets.EC2_HOST }}:8001/chat"
          EOF